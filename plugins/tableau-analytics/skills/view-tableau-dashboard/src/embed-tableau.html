<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tableau Session Bridge — live embedded Tableau view, driven by an agent.">
    <title>Tableau</title>
    <style>
      html, body {
        height: 100%;
        padding: 0;
        margin: 0;
        font-family: system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #06080d;
        overflow: hidden;
      }

      body {
        /* King Violet 7 base with a whisper of violet so the card floats on it. */
        background:
          radial-gradient(1200px 800px at 18% -10%, rgba(93, 98, 132, 0.16), transparent 60%),
          radial-gradient(1000px 700px at 108% 112%, rgba(63, 70, 109, 0.22), transparent 55%),
          #141834;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* --- the stage: the Cool Grey card floats on the King Violet
             background; the dark violet shows in the margins. ---- */
      #viz-stage {
        position: relative;
        box-sizing: border-box;
        width: calc(100vw - 72px);
        height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        /* No overflow:hidden here — it clipped the viz's box shadow. The body
           (overflow:hidden) still prevents scrollbars. */
      }

      /* Native-size box; CSS transform scales it to fit the stage. A Cool Grey
         (base) surface with a thin margin around the viz makes the card read
         as a light card floating on the King Violet background. */
      #viz-scaler {
        position: relative;
        flex: none;
        box-sizing: border-box;
        transform-origin: center;
        will-change: transform;
        background: #d8e9f3; /* Cool Grey */
        padding: 12px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--viz-border, rgba(216, 233, 243, 0.6));
        /* 3D card stack (dark for depth) + bright per-tab halo. */
        box-shadow:
          rgba(0, 0, 0, 0.4) 0px 2px 4px,
          rgba(0, 0, 0, 0.3) 0px 7px 13px -3px,
          var(--viz-halo, rgba(250, 204, 21, 0.5)) 0px 22px 70px 4px;
      }

      /* Top-edge highlight (the inset layer) painted ABOVE the viz iframe so
         the 3D "lit from above" edge stays visible once the viz loads. */
      #viz-scaler::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: rgba(0, 0, 0, 0.2) 0px -3px 0px inset;
        pointer-events: none;
      }

      #viz-wrap {
        width: 100%;
        height: 100%;
      }

      tableau-viz {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 14px;
      }

      /* --- loading overlay: masks the Tableau spinner with our own ----------
         Sits INSIDE the card (#viz-scaler) so it always occupies exactly the
         card's area — never the whole stage — and inherits the card's padding,
         border-radius, and transform scale. The scaler's overflow:hidden clips
         it to the card's rounded corners. Minimal, GPU-cheap animation: a line
         chart that draws itself (CSS stroke-dashoffset + a dot traveling via
         offset-path — no JS rAF, no filters, nothing layout-thrashing). Fades
         out when the viz is interactive. */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #141834;
        border-radius: inherit;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }

      .load-chart {
        display: block;
        width: min(300px, 70vw);
        height: auto;
        overflow: visible;
      }
      .load-chart-line {
        fill: none;
        stroke: rgba(148, 163, 184, 0.28);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .load-chart-draw {
        fill: none;
        stroke: var(--viz-accent, #2dd4bf);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 2.6s ease-in-out infinite;
      }
      @keyframes drawLine {
        0%   { stroke-dashoffset: 1000; opacity: 1; }
        55%  { stroke-dashoffset: 0;    opacity: 1; }
        75%  { stroke-dashoffset: 0;    opacity: 1; }
        100% { stroke-dashoffset: 0;    opacity: 0; }
      }
      .load-chart-dot {
        fill: var(--viz-accent, #2dd4bf);
        offset-path: path("M12 66 L40 54 L68 58 L100 42 L132 50 L168 30 L228 14");
        animation: travelLine 2.6s ease-in-out infinite;
      }
      @keyframes travelLine {
        from { offset-distance: 0%; }
        to   { offset-distance: 100%; }
      }
      .load-text {
        font-size: 13px;
        color: #94a3b8;
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
      }

      /* --- status chip (top-left; auto-hides after a few seconds) ---------- */
      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 20;
        max-width: min(70vw, 640px);
        padding: 6px 14px;
        font-size: 12.5px;
        line-height: 1.45;
        color: #d7e3e1;
        background: rgba(10, 14, 18, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 999px;
        box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
        white-space: pre-wrap;
        backdrop-filter: blur(6px);
        opacity: 1;
        transition: opacity 0.4s ease;
        pointer-events: auto;
      }
      #status.hidden { opacity: 0; pointer-events: none; }
      #status.loading { border-color: rgba(56, 189, 248, 0.5); color: #bae6fd; }
      #status.ready  { border-color: rgba(52, 211, 153, 0.5); color: #a7f3d0; }
      #status.error  { border-color: rgba(248, 113, 113, 0.6); color: #fecaca; }

      /* --- toast stack (top-right) --------------------------------------- */
      #toasts {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 30;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: min(420px, calc(100vw - 32px));
        pointer-events: none;
      }

      .toast {
        pointer-events: auto;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(13, 18, 24, 0.92);
        border: 1px solid rgba(45, 212, 191, 0.35);
        border-left: 3px solid #2dd4bf;
        border-radius: 10px;
        color: #e2e8f0;
        font-size: 13px;
        line-height: 1.45;
        box-shadow:
          0 12px 32px -10px rgba(0, 0, 0, 0.65),
          0 0 24px -8px rgba(45, 212, 191, 0.15);
        backdrop-filter: blur(8px);
        cursor: default;
        opacity: 0;
        transform: translateX(16px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      .toast.show { opacity: 1; transform: translateX(0); }

      /* The auth prompt sits top-left, below the status chip, so the human
         sees it beside the viz rather than in the agent-activity stack. */
      .toast.auth-prompt {
        position: fixed;
        top: 64px;
        left: 16px;
        right: auto;
        border-color: rgba(250, 204, 21, 0.45);
        border-left-color: #facc15;
      }
      .toast.auth-prompt .toast-dot { background: #facc15; box-shadow: 0 0 8px rgba(250, 204, 21, 0.8); }

      /* Agent→human messages: a distinct violet family so they read as a
         different channel from agent activity (teal) and auth (yellow). */
      .toast.agent-message {
        border-color: rgba(139, 92, 246, 0.45);
        border-left-color: #8b5cf6;
      }
      .toast.agent-message .toast-dot { background: #a78bfa; box-shadow: 0 0 8px rgba(167, 139, 250, 0.8); }
      .toast.agent-message .toast-label { color: #c4b5fd; }

      .toast .toast-dot {
        flex: none;
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: #2dd4bf;
        box-shadow: 0 0 8px rgba(45, 212, 191, 0.8);
      }
      .toast .toast-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #5eead4;
        margin-bottom: 2px;
      }
      .toast .toast-text { margin: 0; }
    </style>
  </head>

  <body>
    <div id="status">Initialising session-bridge page…</div>
    <div id="toasts"></div>
    <div id="viz-stage">
      <div id="viz-scaler">
        <div id="loading">
          <svg class="load-chart" viewBox="0 0 240 80" aria-hidden="true" focusable="false">
            <path class="load-chart-line" d="M12 66 L40 54 L68 58 L100 42 L132 50 L168 30 L228 14"></path>
            <path class="load-chart-draw" d="M12 66 L40 54 L68 58 L100 42 L132 50 L168 30 L228 14"></path>
            <circle class="load-chart-dot" r="4"></circle>
          </svg>
          <div class="load-text" id="load-text">Loading Tableau Viz</div>
        </div>
        <div id="viz-wrap"></div>
      </div>
    </div>

    <!--
      Page bootstrap: reads the session config, injects the Embedding API
      library (derived from the viz URL's origin — no hardcoded server), mounts
      <tableau-viz> at a fixed native size, scales it to fit the stage with a
      CSS transform (no reflow), wires lifecycle events, and runs the load
      watchdog. The runtime object below is the seam the executor
      (src/client/executor.ts) consumes: it owns the WebSocket + state machine,
      this script owns the DOM/library/mount/event wiring + notifications.
    -->
    <script type="module">
      const params = new URLSearchParams(window.location.search);

      const session = params.get("session") ?? "";
      const url = params.get("url") ?? "";
      const script = params.get("script") ?? undefined;
      const token = params.get("token") ?? "";
      const libUrlOverride = params.get("lib-url") ?? undefined;

      // Native render size before scaling to fit the stage. Defaults to the
      // 1920x1080 design size; override with ?viz-width=&viz-height=
      // (plumbed from `tableau-viz start --width/--height`).
      function clampInt(raw, fallback, min, max) {
        if (raw === null || raw === undefined || raw === "") return fallback;
        const n = Number(raw);
        if (!Number.isFinite(n)) return fallback;
        return Math.min(max, Math.max(min, Math.round(n)));
      }
      const vizWidth = clampInt(params.get("viz-width"), 1920, 320, 7680);
      const vizHeight = clampInt(params.get("viz-height"), 1080, 240, 4320);
      const MAX_UPSCALE = 1.5; // avoid blur on extreme enlargement

      // Auth seam: Tableau Public views need no session. Authenticated sites
      // (Cloud/Server) show Tableau's in-frame sign-in for a human to complete,
      // or accept a connected-app JWT passed via ?tableau-token=, or one
      // provided at runtime via window.__AUTH__ = { token } — the reserved
      // broker seam. Browser-session reuse across origins is impossible (the
      // Tableau session cookie is Partitioned).
      const tableauToken =
        params.get("tableau-token") ??
        (typeof window.__AUTH__ !== "undefined" ? window.__AUTH__.token : undefined);

      const libUrl =
        libUrlOverride ??
        (() => {
          try {
            return new URL(url).origin + "/javascripts/api/tableau.embedding.3.latest.min.js";
          } catch {
            return "";
          }
        })();

      const statusEl = document.getElementById("status");
      const toastsEl = document.getElementById("toasts");
      const vizWrap = document.getElementById("viz-wrap");
      const stageEl = document.getElementById("viz-stage");
      const scalerEl = document.getElementById("viz-scaler");

      let vizState = "connecting";
      let vizEl = null;
      let watchdog = null;
      let authGraceTimer = null;
      let sawVizSize = false;
      let lastAuthNudge = 0;
      let authNudgeCount = 0;
      let statusTimer = null;

      // --- per-tab identity: a bright primary halo color per session ----------
      // Deterministic from the session id, so every tab (agent, terminal tile,
      // browser) has a stable, distinct color you can spot across surfaces.
      const IDENTITY_COLORS = [
        { halo: "rgba(250, 204, 21, 0.5)",   border: "rgba(253, 230, 138, 0.4)",  accent: "#facc15" },  // yellow
        { halo: "rgba(45, 212, 191, 0.5)",   border: "rgba(94, 234, 212, 0.4)",   accent: "#2dd4bf" },  // teal
        { halo: "rgba(96, 165, 250, 0.5)",   border: "rgba(147, 197, 253, 0.4)",  accent: "#60a5fa" },  // blue
        { halo: "rgba(167, 139, 250, 0.5)",  border: "rgba(196, 181, 253, 0.4)",  accent: "#a78bfa" },  // violet
        { halo: "rgba(244, 114, 182, 0.5)",  border: "rgba(249, 168, 212, 0.4)",  accent: "#f472b6" },  // pink
        { halo: "rgba(251, 146, 60, 0.5)",   border: "rgba(253, 186, 116, 0.4)",  accent: "#fb923c" },  // orange
        { halo: "rgba(74, 222, 128, 0.5)",   border: "rgba(134, 239, 172, 0.4)",  accent: "#4ade80" },  // green
        { halo: "rgba(248, 113, 113, 0.5)",  border: "rgba(252, 165, 165, 0.4)",  accent: "#f87171" },  // red
        { halo: "rgba(103, 232, 249, 0.5)",  border: "rgba(165, 243, 252, 0.4)",  accent: "#67e8f9" },  // cyan
      ];
      function hashCode(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
        return Math.abs(h);
      }
      const identity = IDENTITY_COLORS[hashCode(session) % IDENTITY_COLORS.length];
      // Set on <body> so the scaler, loading overlay, and chart all inherit.
      document.body.style.setProperty("--viz-halo", identity.halo);
      document.body.style.setProperty("--viz-border", identity.border);
      document.body.style.setProperty("--viz-accent", identity.accent);

      // --- loading overlay: cycle status text until the viz is interactive ---
      // Pre-auth: the human may need to sign in, so lead with a status check
      // instead of the misleading "Authenticating…". After auth, a separate
      // step set describes the post-login load (sizing, view prep).
      const LOAD_STEPS = [
        "Checking authentication status…",
        "Reaching server…",
        "Preparing view…",
      ];
      const LOAD_STEPS_AFTER_AUTH = [
        "Signed in — loading viz…",
        "Verifying sizing…",
        "Loading viz…",
      ];
      const loadingEl = document.getElementById("loading");
      const loadTextEl = document.getElementById("load-text");
      let loadStep = 0;
      let loadTimer = null;

      function startLoadCycle(steps) {
        stopLoadCycle();
        loadStep = 0;
        loadTextEl.textContent = steps[0];
        loadTimer = setInterval(() => {
          loadStep = (loadStep + 1) % steps.length;
          loadTextEl.textContent = steps[loadStep];
          // Small fade-in per step via the Web Animations API (no reflow).
          try {
            loadTextEl.animate(
              [{ opacity: 0.35 }, { opacity: 1 }],
              { duration: 300, easing: "ease-out" }
            );
          } catch {
            // animation API unavailable — text still swaps
          }
        }, 600);
      }

      function stopLoadCycle() {
        if (loadTimer) {
          clearInterval(loadTimer);
          loadTimer = null;
        }
      }

      function hideLoading() {
        if (!loadingEl) return;
        loadingEl.classList.add("hide");
      }

      function showLoading() {
        if (!loadingEl) return;
        loadingEl.classList.remove("hide");
      }

      // Terminal hide: stop the text cycle and drop the element for good.
      function removeLoading() {
        stopLoadCycle();
        hideLoading();
        setTimeout(() => loadingEl?.remove(), 500);
      }

      // Start cycling the pre-auth status text immediately (page boot); mountViz
      // re-runs the cycle (post-auth steps if the human just signed in).
      startLoadCycle(LOAD_STEPS);

      // --- status chip: show on change, get out of the way after 6s ----------
      function setBanner(kind, text) {
        statusEl.className = kind;
        statusEl.dataset.state = kind;
        statusEl.textContent = text;
        statusEl.classList.remove("hidden");
        if (statusTimer) {
          clearTimeout(statusTimer);
          statusTimer = null;
        }
        // Errors stay (they need attention); auth stays until it resolves;
        // everything else auto-hides.
        if (kind !== "error" && kind !== "auth") {
          statusTimer = setTimeout(() => statusEl.classList.add("hidden"), 6000);
        }
      }

      // --- toast stack: surfaces agent activity for the human in the loop ---
      function dismissToast(el) {
        if (!el) return;
        el.classList.remove("show");
        setTimeout(() => el.remove(), 300);
      }

      function addToast(text, opts = {}) {
        const el = document.createElement("div");
        el.className = "toast";
        if (opts.authPrompt) {
          el.classList.add("auth-prompt");
        }
        if (opts.variant) {
          el.classList.add(opts.variant);
        }

        const dot = document.createElement("span");
        dot.className = "toast-dot";

        const body = document.createElement("div");
        const label = document.createElement("div");
        label.className = "toast-label";
        label.textContent = opts.label ?? "Agent action";
        const msg = document.createElement("div");
        msg.className = "toast-text";
        msg.textContent = text;

        body.appendChild(label);
        body.appendChild(msg);
        el.appendChild(dot);
        el.appendChild(body);
        toastsEl.appendChild(el);

        // Cap the visible stack.
        while (toastsEl.children.length > 5) {
          toastsEl.removeChild(toastsEl.firstChild);
        }

        requestAnimationFrame(() => el.classList.add("show"));
        // duration: 0 holds the toast until it is explicitly dismissed.
        const duration = opts.duration ?? 4000;
        const timer = duration > 0 ? setTimeout(() => dismissToast(el), duration) : null;
        el.addEventListener("click", () => {
          if (timer) clearTimeout(timer);
          dismissToast(el);
        });
        return el;
      }

      let authToastEl = null;

      function showAuthToast() {
        dismissAuthToast();
        authToastEl = addToast(
          "Please log in with your username and password — the agent will continue once you're signed in.",
          { label: "Authentication required", duration: 0, authPrompt: true }
        );
      }

      function dismissAuthToast() {
        if (authToastEl) {
          dismissToast(authToastEl);
          authToastEl = null;
        }
      }

      // --- fit-to-stage scaling (pure CSS transform; no reflow) --------------
      function applyScale() {
        if (!stageEl || !scalerEl) return;
        const stageW = stageEl.clientWidth;
        const stageH = stageEl.clientHeight;
        if (!stageW || !stageH) return;
        let k = Math.min(stageW / vizWidth, stageH / vizHeight);
        if (k > MAX_UPSCALE) k = MAX_UPSCALE;
        scalerEl.style.transform = `scale(${k.toFixed(4)})`;
      }

      scalerEl.style.width = `${vizWidth}px`;
      scalerEl.style.height = `${vizHeight}px`;

      // Recompute on layout changes (any container: full browser, panes,
      // terminal tiles) and on window resize.
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(applyScale).observe(stageEl);
      }
      window.addEventListener("resize", applyScale);
      applyScale();

      // --- tab title: bridge name first, then the viz name -------------------
      function nameFromUrl() {
        try {
          const m = new URL(url).pathname.match(/\/views\/([^/]+)\/([^/]+)/);
          if (m) return decodeURIComponent(m[2] || m[1] || "");
        } catch {
          // ignore
        }
        return "";
      }

      function updateTabTitle() {
        let name = "";
        try {
          const wb = vizEl?.workbook;
          name = wb?.activeSheet?.name || wb?.name || "";
        } catch {
          // workbook getter can throw pre-interactive; fall back to URL
        }
        document.title = `Tableau: ${name || nameFromUrl() || "loading"}`;
      }

      // --- tiny event bus with last-detail buffering -------------------------
      const handlers = {};
      const lastDetail = {};
      window.__tableauRuntime__ = {
        config: { session, url, script, token, libUrl, tableauToken, vizWidth, vizHeight },
        getVizElement: () => vizEl,
        setStatus: setBanner,
        notify: (text) => addToast(String(text)),
        // One-way agent→human toast. hold keeps it until the human dismisses it;
        // default auto-dismisses after ~4s. Page-level — works even while the
        // viz sits in the `auth` state (no viz interactivity required).
        agentMessage: (text, hold) =>
          addToast(String(text), {
            label: "Agent message",
            duration: hold ? 0 : 4000,
            variant: "agent-message",
          }),
        emit(event, detail) {
          lastDetail[event] = detail;
          (handlers[event] || []).forEach((fn) => fn(detail));
        },
        on(event, fn) {
          (handlers[event] = handlers[event] || []).push(fn);
          if (lastDetail[event] !== undefined) {
            fn(lastDetail[event]);
          }
        },
        getState: () => vizState,
        isInteractive: () => vizState === "interactive",
      };

      function clearWatchdog() {
        if (watchdog) {
          clearTimeout(watchdog);
          watchdog = null;
        }
      }

      function clearAuthGrace() {
        if (authGraceTimer) {
          clearTimeout(authGraceTimer);
          authGraceTimer = null;
        }
      }

      /** The viz's internal iframe src (cross-origin-safe: just an attribute). */
      function currentIframeSrc() {
        try {
          const iframe = vizEl?.shadowRoot?.querySelector("iframe");
          return iframe?.getAttribute("src") ?? "";
        } catch {
          return "";
        }
      }

      /** A real view URL (as opposed to Tableau's sign-in/embeddedAuth/pkce routes). */
      function isViewSrc(src) {
        return /\/views\//.test(src || "");
      }

      /** A Tableau sign-in / auth-helper route (embeddedAuth, pkce, signin, ...). */
      function isAuthRoute(src) {
        return /(embeddedAuth|embedded_auth|pkce|\/auth\/|signin|sign-in|authSetting)/i.test(
          src || ""
        );
      }

      // --- auth-aware overlay state machine -----------------------------------
      // The #loading overlay must NOT cover Tableau's in-frame sign-in helper.
      // When the viz needs auth it parks the iframe on a non-/views/ URL
      // (embeddedAuth/pkce/sign-in); we reveal it (overlay down, watchdog off)
      // until the iframe returns to the view URL or the viz reports a size.

      function armWatchdog() {
        clearWatchdog();
        watchdog = setTimeout(() => {
          // Never fire the watchdog while waiting on auth — the human may take
          // as long as they need to sign in.
          if (vizState === "interactive" || vizState === "error" || vizState === "auth") {
            return;
          }
          vizState = "error";
          const msg =
            "The viz did not fire firstinteractive or vizloaderror within 30s. " +
            "This usually means an authentication/session problem: run 'tableau-viz open-site' to " +
            "establish a session in the browser, or check for blocked third-party cookies.";
          removeLoading();
          setBanner("error", `❌ Watchdog timeout.\n${msg}`);
          window.__tableauRuntime__.emit("watchdog", msg);
        }, 30_000);
      }

      function enterAuthPending() {
        if (vizState === "auth") return;
        vizState = "auth";
        lastAuthNudge = 0;
        authNudgeCount = 0;
        clearWatchdog();
        stopLoadCycle();
        hideLoading(); // reveal the sign-in helper so the human can log in
        setBanner("auth", "🔑 Sign in to Tableau in the embedded view to load this viz.");
        showAuthToast();
        window.__tableauRuntime__.emit("auth-pending");
      }

      // Tableau's in-frame sign-in opens an SSO popup. The popup establishes the
      // partition-scoped session cookie, but the embed iframe sometimes does not
      // advance on its own — the human ends up signing in twice. When the top
      // window regains focus (the popup just closed) and we are still in `auth`,
      // force the iframe to reload (the docs' own reload pattern) so it picks up
      // the new session cookie. Bounded, so a failing auth can't loop forever.
      function nudgeAuthIframe() {
        if (vizState !== "auth" || sawVizSize) return;
        const now = Date.now();
        if (now - lastAuthNudge < 3000 || authNudgeCount >= 5) return;
        lastAuthNudge = now;
        authNudgeCount += 1;
        addToast("Sign-in detected — reloading the view…", {
          label: "Authentication",
          duration: 2500,
        });
        try {
          const iframe = vizEl?.shadowRoot?.querySelector("iframe");
          if (iframe) {
            requestAnimationFrame(() => {
              iframe.src = iframe.src;
            });
          }
        } catch {
          // ignore — the nudge is best-effort
        }
      }
      window.addEventListener("focus", nudgeAuthIframe);

      function enterLoading() {
        const wasAuth = vizState === "auth";
        vizState = "loading";
        startLoadCycle(wasAuth ? LOAD_STEPS_AFTER_AUTH : LOAD_STEPS);
        showLoading();
        armWatchdog();
        if (wasAuth) {
          dismissAuthToast();
          setBanner("loading", "Signed in — loading viz…");
          window.__tableauRuntime__.emit("auth-resolved");
        }
      }

      function mountViz() {
        if (!url) {
          vizState = "error";
          removeLoading();
          setBanner("error", "❌ No viz URL — pass ?url=<view-url> (the CLI does this automatically).");
          return;
        }

        vizEl = document.createElement("tableau-viz");
        vizEl.id = "tableauViz";
        vizEl.setAttribute("src", url);
        vizEl.setAttribute("width", String(vizWidth));
        vizEl.setAttribute("height", String(vizHeight));
        vizEl.setAttribute("toolbar", "bottom");
        vizEl.setAttribute("hide-tabs", "");
        if (tableauToken) {
          vizEl.setAttribute("token", tableauToken);
        }

        vizEl.addEventListener("firstinteractive", () => {
          clearWatchdog();
          clearAuthGrace();
          vizState = "interactive";
          removeLoading();
          setBanner("ready", "✅ Viz interactive — the agent can now drive this view.");
          updateTabTitle();
          window.__tableauRuntime__.emit("firstinteractive");
        });

        vizEl.addEventListener("vizloaderror", (e) => {
          clearWatchdog();
          clearAuthGrace();
          vizState = "error";
          removeLoading();
          const detail = e.detail || {};
          const message =
            typeof detail.message === "string" ? detail.message : JSON.stringify(detail);
          setBanner(
            "error",
            `❌ VizLoadError (${detail.errorCode ?? "unknown"}).\n${message}\n\n` +
              "Auth: Public views need no session. Authenticated sites: a human completes " +
              "the in-frame sign-in, or provide a connected-app token (?tableau-token=). " +
              "Browser-session reuse across origins is blocked by cookie partitioning."
          );
          window.__tableauRuntime__.emit("vizloaderror", {
            errorCode: detail.errorCode,
            message,
          });
        });

        // Real viz content reports a size; the sign-in helper does not. If we
        // had revealed the page for auth, put the overlay back up and re-arm
        // the watchdog now that the viz is actually loading.
        vizEl.addEventListener("firstvizsizeknown", () => {
          sawVizSize = true;
          if (vizState === "auth") {
            enterLoading();
          }
        });

        // The library points the iframe at new URLs as it works (view →
        // embeddedAuth/pkce while signing in → view again). Classify each.
        vizEl.addEventListener("iframesrcupdated", () => {
          const src = currentIframeSrc();
          if (!src) return;
          if (isAuthRoute(src)) {
            enterAuthPending();
          } else if (isViewSrc(src) && vizState === "auth") {
            enterLoading();
          }
        });

        vizWrap.appendChild(vizEl);
        window.__tableauRuntime__.emit("mounted");
        enterLoading(); // initial: overlay up + 30s watchdog

        // Grace fallback: if real content never appears (no firstvizsizeknown /
        // firstinteractive) within ~5s, assume the iframe is parked on Tableau's
        // sign-in helper (some flows redirect without changing the src attr) and
        // reveal it so the human can log in.
        clearAuthGrace();
        authGraceTimer = setTimeout(() => {
          if (vizState === "loading" && !sawVizSize) {
            enterAuthPending();
          }
        }, 5_000);
      }

      // Inject the Embedding API library from the viz URL's origin. The viz
      // mounts only after the module loads (the <tableau-viz> element upgrades
      // on definition).
      function loadLibrary() {
        if (!libUrl) {
          vizState = "error";
          removeLoading();
          setBanner("error", "❌ Could not derive the Embedding API library URL from the viz URL.");
          return;
        }
        const s = document.createElement("script");
        s.type = "module";
        s.src = libUrl;
        s.addEventListener("load", () => {
          setBanner("loading", "Library loaded — mounting viz…");
          mountViz();
        });
        s.addEventListener("error", () => {
          vizState = "error";
          removeLoading();
          setBanner(
            "error",
            `❌ Failed to load the Embedding API library from ${libUrl}.\n` +
              "Confirm the viz URL origin hosts the library, or pass --lib-url to override."
          );
          window.__tableauRuntime__.emit("watchdog", "Embedding API library failed to load.");
        });
        document.head.appendChild(s);
      }

      loadLibrary();
    </script>

    <!--
      The executor (bundled from src/client/executor.ts) — WebSocket, state
      machine, serialized eval loop, safe serializer, helpers, meta scope.
    -->
    <script type="module">
      import("/client/executor.js")
        .then((m) => m.startExecutor())
        .catch((err) => {
          const el = document.getElementById("status");
          if (el) {
            el.className = "error";
            el.textContent = `⚠️ Executor failed to load: ${err}`;
          }
        });
    </script>
  </body>
</html>
